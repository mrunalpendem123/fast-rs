[package]
name = "fast-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde_json = "1"
memmap2 = "0.9"
half = "2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLBuffer", "MTLCommandQueue", "MTLCommandBuffer", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary", "MTLResource", "MTLTypes", "MTLArgument", "MTLCommandEncoder", "MTLDataType"] }

tiny_http = "0.12.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
minijinja = { version = "3.0.5", features = ["serde"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat"] }

[profile.release]
opt-level = 3
debug = 1
