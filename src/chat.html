<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fast-rs</title>
<style>
/* Native chat for the local engine: paper + ink + one cobalt accent, system faces (works offline). */
:root {
  --bg: #f4f2ed; --side: #ebe8e1; --card: #ffffff; --ink: #222222; --mute: #77736b; --line: rgba(34,34,34,.12);
  --accent: #2337e6; --accent-ink: #ffffff; --ok: #4f8a2b; --warn: #c27a00; --code: #f7f6f2; --user: #2337e6;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #19191b; --side: #121214; --card: #222225; --ink: #ecebe7; --mute: #9a978f; --line: rgba(236,235,231,.12);
    --accent: #5b6cff; --code: #161618; --user: #3a4bf0; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: 250px 1fr; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* sidebar */
aside { background: var(--side); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; padding: 14px 10px 10px; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 2px; font: 600 14px var(--mono); }
.mark { width: 16px; height: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.mark i { border-radius: 50%; background: var(--ink); opacity: .2; } .mark i.on { opacity: 1; }
.newchat { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 14px; }
.newchat kbd { font: 11px var(--mono); color: var(--mute); }
.chats { overflow-y: auto; min-height: 0; display: grid; align-content: start; gap: 1px; }
.chats .day { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); padding: 12px 10px 4px; }
.chat-i { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 7px; border: 0; background: transparent; text-align: left; font-size: 13.5px; width: 100%; }
.chat-i span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-i:hover { background: var(--line); }
.chat-i.on { background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.chat-i .x { opacity: 0; border: 0; background: none; color: var(--mute); padding: 0 2px; font-size: 15px; line-height: 1; }
.chat-i:hover .x { opacity: 1; }
.engine { font: 11.5px/1.5 var(--mono); color: var(--mute); padding: 10px; border-top: 1px solid var(--line); }
.engine b { color: var(--ink); font-weight: 500; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.dot.warn { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.dot.off { background: #b33; }
@keyframes pulse { 50% { opacity: .3; } }

/* main */
main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; min-width: 0; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.picker { position: relative; }
.picker > button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 6px 10px; border-radius: 8px; font-weight: 500; font-size: 14px; }
.picker > button small { color: var(--mute); font-weight: 400; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.14); padding: 6px; min-width: 330px; }
.menu button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; }
.menu button:hover, .menu button.on { background: var(--bg); }
.menu b { font-weight: 500; }
.menu small { grid-column: 1; color: var(--mute); font-size: 12px; }
.menu em { grid-row: 1 / 3; grid-column: 2; align-self: center; font: 11px var(--mono); font-style: normal; color: var(--mute); }
.menu em.ok { color: var(--ok); }
.note { font-size: 12.5px; color: var(--mute); }
.note.warn { color: var(--warn); }
.spacer { flex: 1; }

.scroll { overflow-y: auto; min-height: 0; scroll-behavior: smooth; }
.thread { max-width: 760px; margin: 0 auto; padding: 28px 24px 12px; display: grid; gap: 26px; }
.msg.user { justify-self: end; max-width: 80%; background: var(--user); color: #fff; padding: 9px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-break: break-word; }
.msg.bot { min-width: 0; }
.msg.bot .body { word-break: break-word; }
.msg.bot .body > :first-child { margin-top: 0; } .msg.bot .body > :last-child { margin-bottom: 0; }
.body p { margin: 0 0 12px; } .body ul, .body ol { margin: 0 0 12px; padding-left: 22px; } .body li { margin: 3px 0; }
.body h1, .body h2, .body h3, .body h4 { font-size: 16px; margin: 18px 0 8px; font-weight: 600; }
.body h1 { font-size: 19px; } .body h2 { font-size: 17px; }
.body code { font: 13px var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.body pre { position: relative; background: var(--code); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; overflow: hidden; }
.body pre .lang { display: flex; justify-content: space-between; align-items: center; font: 11px var(--mono); color: var(--mute); padding: 6px 12px; border-bottom: 1px solid var(--line); }
.body pre .lang button { border: 0; background: none; font: 11px var(--mono); color: var(--mute); padding: 0; }
.body pre .lang button:hover { color: var(--ink); }
.body pre code { display: block; border: 0; background: none; padding: 12px 14px; overflow-x: auto; white-space: pre; font-size: 12.8px; line-height: 1.6; }
.body hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.body blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--mute); }
.caret { display: inline-block; width: 8px; height: 1.05em; background: var(--accent); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stats { margin-top: 10px; font: 11.5px var(--mono); color: var(--mute); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.stats b { color: var(--ink); font-weight: 500; }
.stats .copy { border: 0; background: none; padding: 0; font: inherit; color: var(--mute); }
.stats .copy:hover { color: var(--ink); }
.wait { color: var(--mute); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.bar { width: 120px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { left: -35%; } to { left: 100%; } }
.err { color: #c0392b; font-size: 14px; }

.empty { max-width: 640px; margin: 14vh auto 0; padding: 0 24px; text-align: center; }
.empty h1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
.empty p { color: var(--mute); margin: 0 0 26px; }
.sugg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.sugg button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.sugg button small { display: block; color: var(--mute); font-size: 12.5px; }
.sugg button:hover { border-color: var(--accent); }

footer { padding: 10px 24px 18px; }
.composer { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.05); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px; padding: 10px 10px 10px 16px; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
textarea:focus-visible { outline: none; }
textarea { resize: none; border: 0; outline: 0; background: none; color: var(--ink); font: 15px/1.5 var(--sans); max-height: 220px; padding: 4px 0; }
.send { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.send:disabled { opacity: .35; cursor: default; }
.send.stop { background: var(--ink); color: var(--bg); }
.hint { max-width: 760px; margin: 6px auto 0; font: 11px var(--mono); color: var(--mute); text-align: center; }
body.app aside { padding-top: 40px; }
body.app header { padding-top: 12px; -webkit-app-region: drag; }
@media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { display: none; } .sugg { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="mark" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i class="on"></i></span>fast-rs</div>
  <button class="newchat" id="new" type="button">New chat <kbd>⌘N</kbd></button>
  <nav class="chats" id="chats" aria-label="Chats"></nav>
  <div class="engine" id="engine"><span class="dot warn"></span>Connecting to the engine…</div>
</aside>
<main>
  <header>
    <div class="picker">
      <button type="button" id="pick" aria-haspopup="true" aria-expanded="false"><span id="pickname">—</span><small id="pickstate"></small><span aria-hidden="true">▾</span></button>
      <div class="menu" id="menu" hidden></div>
    </div>
    <span class="note" id="note"></span>
    <span class="spacer"></span>
    <span class="note">On this Mac · nothing leaves it</span>
  </header>
  <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Message fast-rs" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="hint">Enter to send · Shift+Enter for a new line · answers are word-for-word what plain decoding gives</div>
  </footer>
</main>
<script>
const MODELS = {
  "qwen3-4b": {name: "Qwen3-4B", info: "Best all-rounder · fastest on code and maths", load: 20},
  "qwen3.5-4b": {name: "Qwen3.5-4B", info: "Newer Qwen with linear-attention layers", load: 25},
  "gemma-4-e2b": {name: "Gemma 4 E2B", info: "Smallest and quickest to load · 1.6 GB", load: 8},
  "gemma-4-e4b": {name: "Gemma 4 E4B", info: "Larger Gemma · 3.1 GB", load: 30}
};
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let chats = store.get("fastrs.chats", []), cur = null, models = [], status = {}, busy = null;
let model = store.get("fastrs.model", "qwen3-4b");

/* ---------- markdown (escape first, then a small safe subset) ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function inline(s) {
  return s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(src, streaming) {
  const lines = esc(src).split("\n"); let out = "", i = 0, list = null, para = [];
  const flush = () => { if (para.length) { out += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^```\s*([\w+-]*)/);
    if (fence) {
      flush(); close(); const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      out += `<pre><div class="lang"><span>${fence[1] || "code"}</span><button type="button" data-copy>Copy</button></div><code>${code.join("\n")}</code></pre>`;
      i++; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); close(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if (/^\s*([-*_])\s*\1\s*\1\s*$/.test(l)) { flush(); close(); out += "<hr>"; }
    else if ((m = l.match(/^\s*[-*+]\s+(.*)/))) { flush(); if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flush(); if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^&gt;\s?(.*)/))) { flush(); close(); out += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (!l.trim()) { flush(); close(); }
    else { close(); para.push(l); }
    i++;
  }
  flush(); close();
  if (streaming) out = out.replace(/(<\/(p|li|code|h\d)>)(<\/\w+>)*$/, m => '<span class="caret"></span>' + m);
  if (streaming && !/caret/.test(out)) out += '<span class="caret"></span>';
  return out;
}

/* ---------- chats ---------- */
const save = () => store.set("fastrs.chats", chats.slice(0, 200));
function newChat() { cur = {id: Date.now().toString(36), title: "New chat", model, messages: []}; renderThread(); renderChats(); $("input").focus(); }
function renderChats() {
  const nav = $("chats"); nav.innerHTML = "";
  const today = new Date().toDateString(); let lastDay = null;
  chats.forEach(c => {
    const d = new Date(parseInt(c.id, 36)).toDateString() === today ? "Today" : "Earlier";
    if (d !== lastDay) { nav.insertAdjacentHTML("beforeend", `<div class="day">${d}</div>`); lastDay = d; }
    const b = document.createElement("div"); b.className = "chat-i" + (cur && c.id === cur.id ? " on" : ""); b.tabIndex = 0; b.setAttribute("role", "button");
    b.innerHTML = `<span>${esc(c.title)}</span><button class="x" type="button" aria-label="Delete chat">×</button>`;
    b.addEventListener("click", e => { if (e.target.classList.contains("x")) { chats = chats.filter(x => x !== c); save(); if (cur === c) newChat(); else renderChats(); return; } if (busy) return; cur = c; model = c.model || model; syncPicker(); renderThread(); renderChats(); });
    nav.appendChild(b);
  });
}
function statsLine(s) {
  if (!s) return "";
  const wps = s.words / Math.max(s.seconds, 1e-3), per = s.words / Math.max(s.checks, 1);
  return `<b>${wps.toFixed(1)}</b> words/s · ${s.words} words in ${s.seconds.toFixed(1)} s · ${per.toFixed(2)} words per check · ${MODELS[s.model]?.name || s.model}`;
}
function botEl(m, streaming) {
  const d = document.createElement("div"); d.className = "msg bot";
  d.innerHTML = `<div class="body">${m.content ? md(m.content, streaming) : (streaming ? '<span class="caret"></span>' : "")}</div>` +
    (m.stats ? `<div class="stats">${statsLine(m.stats)}<button class="copy" type="button" data-copyall>Copy</button></div>` : "");
  return d;
}
function renderThread() {
  const t = $("thread"); t.innerHTML = "";
  if (!cur.messages.length) {
    t.innerHTML = `<div class="empty"><h1>What should we write?</h1><p>Running on this Mac with guess-and-check decoding. Same words as plain decoding, about twice as fast.</p><div class="sugg">
      <button type="button">Write a Python function<small>that checks if a number is prime</small></button>
      <button type="button">Explain simply<small>why the sky is blue</small></button>
      <button type="button">Solve step by step<small>a train goes 180 km in 2.5 hours; how fast?</small></button>
      <button type="button">Draft an email<small>asking to move a meeting to Friday</small></button></div></div>`;
    t.querySelectorAll(".sugg button").forEach(b => b.addEventListener("click", () => { $("input").value = b.firstChild.textContent + " " + b.querySelector("small").textContent; send(); }));
    return;
  }
  cur.messages.forEach(m => {
    if (m.role === "user") { const d = document.createElement("div"); d.className = "msg user"; d.textContent = m.content; t.appendChild(d); }
    else t.appendChild(botEl(m, false));
  });
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy],[data-copyall]"); if (!b) return;
  const text = b.hasAttribute("data-copy") ? b.closest("pre").querySelector("code").textContent : b.closest(".msg").querySelector(".body").innerText;
  const done = ok => { const t = b.textContent; b.textContent = ok ? "Copied" : "Press ⌘C"; setTimeout(() => b.textContent = t, 1300); };
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (err) { done(false); }
});

/* ---------- engine status + model picker ---------- */
function syncPicker() {
  $("pickname").textContent = MODELS[model]?.name || model;
  const loaded = status.loaded === model, loading = status.loading === model;
  $("pickstate").textContent = loaded ? "· loaded" : loading ? "· loading…" : "· not loaded";
  const n = $("note");
  if (status.loading) { n.className = "note warn"; n.textContent = `Loading ${MODELS[status.loading]?.name || status.loading}…`; }
  else if (!loaded && status.loaded) { n.className = "note"; n.textContent = `Your first message loads it (about ${MODELS[model]?.load || 20} s); one model fits in memory at a time.`; }
  else { n.className = "note"; n.textContent = ""; }
  store.set("fastrs.model", model);
}
function renderMenu() {
  const m = $("menu"); m.innerHTML = "";
  models.forEach(id => {
    const info = MODELS[id] || {name: id, info: ""}, st = status.loaded === id ? '<em class="ok">loaded</em>' : status.loading === id ? "<em>loading…</em>" : `<em>~${info.load || 20} s to load</em>`;
    const b = document.createElement("button"); b.type = "button"; b.className = id === model ? "on" : "";
    b.innerHTML = `<b>${info.name}</b><small>${info.info}</small>${st}`;
    b.addEventListener("click", () => { model = id; if (cur) cur.model = id; m.hidden = true; $("pick").setAttribute("aria-expanded", "false"); syncPicker(); });
    m.appendChild(b);
  });
}
$("pick").addEventListener("click", e => { e.stopPropagation(); const m = $("menu"); m.hidden = !m.hidden; $("pick").setAttribute("aria-expanded", String(!m.hidden)); if (!m.hidden) renderMenu(); });
document.addEventListener("click", e => { if (!e.target.closest(".picker")) { $("menu").hidden = true; $("pick").setAttribute("aria-expanded", "false"); } });
async function poll() {
  try {
    status = await (await fetch("/status")).json();
    if (!models.length) models = (await (await fetch("/v1/models")).json()).data.map(d => d.id);
    if (!models.includes(model)) model = models[0];
    const n = s => MODELS[s]?.name || s;
    $("engine").innerHTML = status.loading ? `<span class="dot warn"></span>Loading <b>${n(status.loading)}</b>` : `<span class="dot"></span>Engine ready · <b>${n(status.loaded)}</b> in memory`;
  } catch (e) { $("engine").innerHTML = '<span class="dot off"></span>Engine not reachable'; }
  syncPicker();
  setTimeout(poll, status.loading || busy ? 700 : 2500);
}

/* ---------- send / stream ---------- */
const input = $("input"), sendBtn = $("send");
function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; sendBtn.disabled = !busy && !input.value.trim(); }
input.addEventListener("input", grow);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); } });
$("form").addEventListener("submit", e => { e.preventDefault(); if (busy) busy.abort(); else send(); });
$("new").addEventListener("click", () => { if (!busy) newChat(); });
document.addEventListener("keydown", e => { if (e.metaKey && e.key.toLowerCase() === "n") { e.preventDefault(); if (!busy) newChat(); } });

async function send() {
  const text = input.value.trim(); if (!text || busy) return;
  input.value = ""; grow();
  if (!cur.messages.length) { cur.title = text.slice(0, 60); cur.model = model; chats.unshift(cur); }
  cur.messages.push({role: "user", content: text}); save(); renderThread(); renderChats();
  const bot = {role: "assistant", content: ""};
  const el = botEl(bot, true); $("thread").appendChild(el);
  const body = el.querySelector(".body");
  const needLoad = status.loaded !== model;
  if (needLoad) body.innerHTML = `<div class="wait"><span class="bar"><i></i></span>Loading ${MODELS[model]?.name || model} (about ${MODELS[model]?.load || 20} s, only when switching)…</div>`;
  $("scroll").scrollTop = $("scroll").scrollHeight;
  busy = new AbortController(); sendBtn.classList.add("stop"); sendBtn.disabled = false; sendBtn.setAttribute("aria-label", "Stop");
  sendBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="currentColor"/></svg>';
  let pending = false;
  const paint = () => { pending = false; body.innerHTML = md(bot.content, true); const s = $("scroll"); if (s.scrollHeight - s.scrollTop - s.clientHeight < 160) s.scrollTop = s.scrollHeight; };
  try {
    const r = await fetch("/v1/chat/completions", {method: "POST", signal: busy.signal, headers: {"content-type": "application/json"},
      body: JSON.stringify({model, stream: true, max_tokens: 2048, messages: cur.messages.map(m => ({role: m.role, content: m.content}))})});
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const {value, done} = await rd.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let k; while ((k = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, k).trim(); buf = buf.slice(k + 2);
        if (!line.startsWith("data:") || line.includes("[DONE]")) continue;
        const j = JSON.parse(line.slice(5));
        const c = j.choices?.[0]?.delta?.content; if (c) { bot.content += c; if (!pending) { pending = true; requestAnimationFrame(paint); } }
        if (j.fast_rs) bot.stats = j.fast_rs;
      }
    }
  } catch (e) { if (e.name !== "AbortError") bot.error = "The engine stopped answering. Check that fast-rs is running."; }
  busy = null; sendBtn.classList.remove("stop"); sendBtn.setAttribute("aria-label", "Send");
  sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  grow();
  if (bot.content) cur.messages.push(bot);
  save();
  const fin = botEl(bot, false); if (bot.error) fin.querySelector(".body").insertAdjacentHTML("beforeend", `<p class="err">${bot.error}</p>`);
  el.replaceWith(fin); input.focus();
}

if (/[?&]app=1/.test(location.search)) document.body.classList.add("app");
newChat(); poll();
